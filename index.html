<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 25%, #fdfbfb 50%, #a1c4fd 75%, #c2e9fb 100%);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating hearts background */
    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp linear infinite;
      opacity: 0.4;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Animal decorations */
    .animals-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .animal {
      position: absolute;
      font-size: 40px;
      animation: bounce 3s ease-in-out infinite;
    }

    .animal:nth-child(1) { top: 8%; left: 5%; animation-delay: 0s; }
    .animal:nth-child(2) { top: 15%; right: 8%; animation-delay: 0.5s; }
    .animal:nth-child(3) { bottom: 12%; left: 10%; animation-delay: 1s; }
    .animal:nth-child(4) { bottom: 20%; right: 5%; animation-delay: 1.5s; }
    .animal:nth-child(5) { top: 45%; left: 3%; animation-delay: 0.7s; }
    .animal:nth-child(6) { top: 50%; right: 3%; animation-delay: 1.2s; }
    .animal:nth-child(7) { top: 75%; left: 6%; animation-delay: 0.3s; }
    .animal:nth-child(8) { top: 30%; right: 6%; animation-delay: 0.9s; }
    .animal:nth-child(9) { bottom: 5%; right: 40%; animation-delay: 1.7s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    /* Sausage dog walking animation */
    .walking-dog {
      position: fixed;
      bottom: 30px;
      font-size: 50px;
      z-index: 2;
      animation: walkAcross 18s linear infinite;
      pointer-events: none;
    }

    @keyframes walkAcross {
      0% { left: -80px; transform: scaleX(1); }
      49% { left: calc(100% + 20px); transform: scaleX(1); }
      50% { left: calc(100% + 20px); transform: scaleX(-1); }
      99% { left: -80px; transform: scaleX(-1); }
      100% { left: -80px; transform: scaleX(1); }
    }

    /* Main content */
    .main-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .title-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .dear-elliot {
      font-family: 'Pacifico', cursive;
      font-size: 2.5rem;
      color: #e74c8b;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
      margin-bottom: 10px;
      animation: fadeInDown 1s ease;
    }

    .question {
      font-family: 'Pacifico', cursive;
      font-size: 3.5rem;
      background: linear-gradient(45deg, #e74c8b, #ff6b6b, #ee5a24, #e74c8b);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeInDown 1s ease 0.3s both, textShimmer 3s ease infinite;
      text-shadow: none;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
    }

    @keyframes textShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Animal emojis around the title */
    .title-animals {
      font-size: 2rem;
      margin: 15px 0;
      animation: fadeInDown 1s ease 0.5s both;
    }

    /* Buttons */
    .buttons-area {
      position: relative;
      width: 400px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      animation: fadeInDown 1s ease 0.7s both;
    }

    .btn-yes {
      padding: 18px 50px;
      font-size: 1.5rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24, #e74c8b);
      background-size: 200% 200%;
      animation: gradientShift 3s ease infinite;
      color: white;
      box-shadow: 0 6px 25px rgba(231, 76, 139, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 20;
      position: relative;
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 35px rgba(231, 76, 139, 0.6);
    }

    .btn-no {
      padding: 14px 35px;
      font-size: 1.2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: 2px solid #ccc;
      border-radius: 50px;
      cursor: pointer;
      background: white;
      color: #999;
      transition: all 0.3s;
      position: absolute;
      z-index: 15;
      user-select: none;
    }

    .btn-no:hover {
      opacity: 0;
      pointer-events: none;
    }

    /* Celebration screen */
    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: zoomIn 0.6s ease;
    }

    .celebration.active {
      display: flex;
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }

    .celebration-text {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: #e74c8b;
      margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .celebration-subtext {
      font-size: 1.3rem;
      color: #666;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .photo-container {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    .photo-container img {
      width: 350px;
      height: 400px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(231, 76, 139, 0.3);
      position: relative;
      z-index: 2;
    }

    /* Heart border animation */
    .heart-border {
      position: absolute;
      top: -20px; left: -20px;
      right: -20px; bottom: -20px;
      z-index: 1;
      pointer-events: none;
    }

    .heart-border svg {
      width: 100%;
      height: 100%;
    }

    .heart-border .heart-path {
      fill: none;
      stroke: #e74c8b;
      stroke-width: 3;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawHeart 2s ease forwards;
    }

    @keyframes drawHeart {
      to { stroke-dashoffset: 0; }
    }

    /* Orbiting hearts around photo */
    .orbiting-hearts {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      z-index: 3;
    }

    .orbit-heart {
      position: absolute;
      font-size: 24px;
      animation: orbit 4s linear infinite;
    }

    .orbit-heart:nth-child(1) { animation-delay: 0s; }
    .orbit-heart:nth-child(2) { animation-delay: 0.5s; }
    .orbit-heart:nth-child(3) { animation-delay: 1s; }
    .orbit-heart:nth-child(4) { animation-delay: 1.5s; }
    .orbit-heart:nth-child(5) { animation-delay: 2s; }
    .orbit-heart:nth-child(6) { animation-delay: 2.5s; }
    .orbit-heart:nth-child(7) { animation-delay: 3s; }
    .orbit-heart:nth-child(8) { animation-delay: 3.5s; }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(220px) rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) translateX(220px) rotate(-180deg) scale(1.2); }
      100% { transform: rotate(360deg) translateX(220px) rotate(-360deg) scale(0.8); }
    }

    /* Pulsing glow behind photo */
    .photo-glow {
      position: absolute;
      top: -10px; left: -10px;
      right: -10px; bottom: -10px;
      background: radial-gradient(ellipse, rgba(231, 76, 139, 0.3), transparent 70%);
      border-radius: 25px;
      animation: pulse 2s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    /* Go back button */
    .btn-back {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: 2px solid #e74c8b;
      border-radius: 50px;
      cursor: pointer;
      background: transparent;
      color: #e74c8b;
      transition: all 0.3s;
    }

    .btn-back:hover {
      background: #e74c8b;
      color: white;
    }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Sparkle effect */
    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 16px;
      animation: sparkleAnim 0.8s ease forwards;
      z-index: 50;
    }

    @keyframes sparkleAnim {
      0% { opacity: 1; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
      100% { opacity: 0; transform: scale(0) rotate(360deg); }
    }

    /* Rainbow border around title */
    .rainbow-border {
      padding: 30px 50px;
      border-radius: 30px;
      background: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
    }

    .rainbow-border::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px;
      right: -3px; bottom: -3px;
      background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #ff6b6b);
      background-size: 400% 400%;
      animation: rainbowBorder 4s linear infinite;
      border-radius: 32px;
      z-index: -1;
    }

    @keyframes rainbowBorder {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .dear-elliot { font-size: 1.8rem; }
      .question { font-size: 2.2rem; }
      .buttons-area { width: 300px; }
      .photo-container img { width: 280px; height: 340px; }
      .celebration-text { font-size: 2rem; }
      .rainbow-border { padding: 20px 25px; }
      .animal { font-size: 28px; }
      .orbit-heart { font-size: 18px; }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(170px) rotate(0deg) scale(0.8); }
        50% { transform: rotate(180deg) translateX(170px) rotate(-180deg) scale(1.2); }
        100% { transform: rotate(360deg) translateX(170px) rotate(-360deg) scale(0.8); }
      }
    }
  </style>
</head>
<body>

  <!-- Floating hearts background -->
  <div class="floating-hearts" id="floating-hearts"></div>

  <!-- Animal decorations -->
  <div class="animals-container">
    <div class="animal" title="seal">🦭</div>
    <div class="animal" title="dachshund">🐕</div>
    <div class="animal" title="ginger cat">🐱</div>
    <div class="animal" title="seal">🦭</div>
    <div class="animal" title="dachshund">🌭🐶</div>
    <div class="animal" title="ginger cat">😺</div>
    <div class="animal" title="seal">🦭</div>
    <div class="animal" title="dachshund">🐕</div>
    <div class="animal" title="ginger cat">🐱</div>
  </div>

  <!-- Walking sausage dog -->
  <div class="walking-dog">🐕</div>

  <!-- Main content -->
  <div class="main-content">

    <!-- Question screen -->
    <div id="question-screen">
      <div class="title-section">
        <div class="rainbow-border">
          <div class="title-animals">🦭 🐕 🐱 🐾 🐱 🐕 🦭</div>
          <div class="dear-elliot">Dear Elliot,</div>
          <div class="question">Will you be my Valentine?</div>
          <div class="title-animals">💕 🦭 🌹 🐕 💝 🐱 💕</div>
        </div>
      </div>

      <div class="buttons-area" id="buttons-area">
        <button class="btn-yes" id="btn-yes" onclick="sayYes()">Yes! 💕</button>
        <button class="btn-no" id="btn-no">No</button>
      </div>
    </div>

    <!-- Celebration screen -->
    <div class="celebration" id="celebration-screen">
      <div class="celebration-text">Yay! 🎉💕</div>
      <div class="celebration-subtext">I knew you'd say yes! Happy Valentine's Day! 🦭🐕🐱</div>

      <div class="photo-container" id="photo-container">
        <div class="photo-glow"></div>
        <img id="valentine-photo" src="" alt="Us together">
        <div class="orbiting-hearts">
          <div class="orbit-heart">💖</div>
          <div class="orbit-heart">💕</div>
          <div class="orbit-heart">💗</div>
          <div class="orbit-heart">💝</div>
          <div class="orbit-heart">💖</div>
          <div class="orbit-heart">💕</div>
          <div class="orbit-heart">💗</div>
          <div class="orbit-heart">💝</div>
        </div>
      </div>

      <button class="btn-back" onclick="goBack()">← Ask me again 🐕</button>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script>
    // =====================
    // Photo Management
    // =====================
    let photos = [];
    let photosReady = false;

    // Probe for photos: try photo1.jpg, photo1.jpeg, photo2.jpg, photo2.jpeg, etc.
    // Stops when a number has neither .jpg nor .jpeg
    function discoverPhotos() {
      return new Promise((resolve) => {
        const found = [];
        let index = 1;

        function probeNext() {
          const jpgPath = 'photos/photo' + index + '.jpg';
          const jpegPath = 'photos/photo' + index + '.jpeg';

          const imgJpg = new Image();
          const imgJpeg = new Image();
          let settled = false;

          function onFound(path) {
            if (settled) return;
            settled = true;
            found.push(path);
            index++;
            probeNext();
          }

          function onBothFailed() {
            // Neither extension worked for this index — we're done
            resolve(found);
          }

          let jpgDone = false;
          let jpegDone = false;

          imgJpg.onload = () => onFound(jpgPath);
          imgJpg.onerror = () => {
            jpgDone = true;
            if (jpegDone) onBothFailed();
          };

          imgJpeg.onload = () => onFound(jpegPath);
          imgJpeg.onerror = () => {
            jpegDone = true;
            if (jpgDone) onBothFailed();
          };

          imgJpg.src = jpgPath;
          imgJpeg.src = jpegPath;
        }

        probeNext();
      });
    }

    function getRandomPhoto() {
      if (photos.length === 0) return '';
      const lastShown = localStorage.getItem('valentineLastPhoto') || '';
      let available = photos.filter(p => p !== lastShown);
      if (available.length === 0) available = photos;
      const pick = available[Math.floor(Math.random() * available.length)];
      localStorage.setItem('valentineLastPhoto', pick);
      return pick;
    }

    // =====================
    // Floating Hearts
    // =====================
    function createFloatingHearts() {
      const container = document.getElementById('floating-hearts');
      const heartEmojis = ['💕', '💖', '💗', '💝', '❤️', '🩷', '🧡', '💛'];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
        heart.style.left = Math.random() * 100 + '%';
        heart.style.fontSize = (16 + Math.random() * 20) + 'px';
        heart.style.animationDuration = (8 + Math.random() * 12) + 's';
        heart.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(heart);
      }
    }

    // =====================
    // No Button Avoidance
    // =====================
    const btnNo = document.getElementById('btn-no');
    const buttonsArea = document.getElementById('buttons-area');

    btnNo.addEventListener('mouseenter', function () {
      const areaRect = buttonsArea.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      // Move to random position within the viewport
      const maxX = window.innerWidth - btnRect.width - 20;
      const maxY = window.innerHeight - btnRect.height - 20;

      let newX = Math.random() * maxX;
      let newY = Math.random() * maxY;

      btnNo.style.position = 'fixed';
      btnNo.style.left = newX + 'px';
      btnNo.style.top = newY + 'px';
      btnNo.style.transition = 'none';

      // Shrink the No button each time
      const currentSize = parseFloat(btnNo.style.fontSize) || 1.2;
      btnNo.style.fontSize = Math.max(0.6, currentSize - 0.1) + 'rem';
      btnNo.style.padding = '10px 25px';
    });

    // Also handle touch
    btnNo.addEventListener('touchstart', function (e) {
      e.preventDefault();
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight - 50;
      btnNo.style.position = 'fixed';
      btnNo.style.left = Math.random() * maxX + 'px';
      btnNo.style.top = Math.random() * maxY + 'px';
    });

    // =====================
    // Yes Button Follows Mouse
    // =====================
    const btnYes = document.getElementById('btn-yes');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let yesFollowing = true;

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;

      // Sparkle trail
      if (Math.random() < 0.15 && document.getElementById('question-screen').style.display !== 'none') {
        createSparkle(e.clientX, e.clientY);
      }
    });

    function animateYesButton() {
      if (!yesFollowing) return;

      const rect = btnYes.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;

      const dx = mouseX - btnCenterX;
      const dy = mouseY - btnCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Ease towards cursor when within 300px
      if (dist < 300 && dist > 5) {
        const speed = 0.08;
        const currentLeft = parseFloat(btnYes.style.left) || 0;
        const currentTop = parseFloat(btnYes.style.top) || 0;

        btnYes.style.position = 'relative';
        btnYes.style.left = (currentLeft + dx * speed) + 'px';
        btnYes.style.top = (currentTop + dy * speed) + 'px';
      }

      requestAnimationFrame(animateYesButton);
    }

    animateYesButton();

    // =====================
    // Sparkle effect
    // =====================
    function createSparkle(x, y) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.textContent = ['✨', '💖', '⭐', '💕', '🌟'][Math.floor(Math.random() * 5)];
      sparkle.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
      sparkle.style.top = (y + (Math.random() - 0.5) * 30) + 'px';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 800);
    }

    // =====================
    // Confetti
    // =====================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiPieces = [];
    let confettiRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createConfetti() {
      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff',
                      '#5f27cd', '#01a3a4', '#f368e0', '#ff9f43', '#ee5a24',
                      '#e74c8b', '#00d2d3', '#ff6348', '#7bed9f'];
      confettiPieces = [];

      for (let i = 0; i < 300; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 10 + 5,
          h: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 2,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.2,
          drift: (Math.random() - 0.5) * 2,
          opacity: 1
        });
      }

      confettiRunning = true;
      animateConfetti();
    }

    function animateConfetti() {
      if (!confettiRunning) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let activeCount = 0;
      confettiPieces.forEach(p => {
        if (p.opacity <= 0) return;
        activeCount++;

        p.y += p.speed;
        p.x += p.drift;
        p.angle += p.spin;

        if (p.y > canvas.height + 20) {
          p.opacity -= 0.02;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });

      if (activeCount > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        confettiRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    // =====================
    // Say Yes!
    // =====================
    function sayYes() {
      yesFollowing = false;

      // Hide question, show celebration
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('celebration-screen').classList.add('active');

      // Set random photo
      const photo = getRandomPhoto();
      if (photo) {
        document.getElementById('valentine-photo').src = photo;
        document.getElementById('photo-container').style.display = '';
      } else {
        document.getElementById('photo-container').style.display = 'none';
      }

      // Launch confetti
      createConfetti();

      // Extra confetti bursts
      setTimeout(createConfetti, 1000);
      setTimeout(createConfetti, 2500);
    }

    // =====================
    // Go Back
    // =====================
    function goBack() {
      document.getElementById('celebration-screen').classList.remove('active');
      document.getElementById('question-screen').style.display = '';

      // Reset Yes button position
      btnYes.style.left = '0px';
      btnYes.style.top = '0px';
      yesFollowing = true;
      animateYesButton();

      // Reset No button
      btnNo.style.position = 'absolute';
      btnNo.style.left = '';
      btnNo.style.top = '';
      btnNo.style.fontSize = '';
      btnNo.style.padding = '';

      // Clear confetti
      confettiRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // =====================
    // Initialize
    // =====================
    createFloatingHearts();
    discoverPhotos().then(found => {
      photos = found;
      photosReady = true;
    });
  </script>
</body>
</html>
