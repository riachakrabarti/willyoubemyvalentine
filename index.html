<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Valentine?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #faf6f0;
      font-family: 'Quicksand', sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== ENVELOPE SCENE ===== */
    #envelope-scene {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(170deg, #faf6f0 0%, #f5ece0 50%, #faf6f0 100%);
      z-index: 1000;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }

    #envelope-scene.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .envelope-hint {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.95rem;
      color: #b8a898;
      margin-top: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: fadeInUp 1s ease 1s both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .envelope-wrapper {
      position: relative;
      width: 380px;
      height: 260px;
      animation: envelopeAppear 0.8s ease both;
    }

    @keyframes envelopeAppear {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .envelope-body {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
      background: linear-gradient(180deg, #e8ddd0 0%, #ddd0c0 100%);
      border-radius: 4px 4px 12px 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      z-index: 2;
      overflow: hidden;
    }

    .envelope-body::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        linear-gradient(135deg, transparent 48%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 52%),
        linear-gradient(-135deg, transparent 48%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 52%);
    }

    .envelope-inner {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 200px;
      z-index: 1;
      overflow: hidden;
    }

    .envelope-inner-pattern {
      width: 100%; height: 100%;
      background:
        repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(180,60,60,0.08) 8px, rgba(180,60,60,0.08) 9px),
        repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(180,60,60,0.08) 8px, rgba(180,60,60,0.08) 9px);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 140px;
      z-index: 3;
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .envelope-flap-shape {
      width: 0; height: 0;
      border-left: 190px solid transparent;
      border-right: 190px solid transparent;
      border-top: 140px solid #d4c8b8;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
    }

    .envelope-wrapper.opening .envelope-flap {
      transform: rotateX(180deg);
    }

    .letter {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 160px;
      background: white;
      border-radius: 4px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s;
    }

    .envelope-wrapper.opening .letter {
      transform: translateX(-50%) translateY(-220px);
    }

    .letter-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.5rem;
      color: #8b4a4a;
      text-align: center;
      line-height: 1.6;
    }

    .wax-seal {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 50px;
      z-index: 4;
      transition: opacity 0.3s ease;
    }

    .envelope-wrapper.opening .wax-seal { opacity: 0; }

    .envelope-front-text {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: #8b6f5e;
      z-index: 5;
      white-space: nowrap;
      transition: opacity 0.3s ease;
    }

    .envelope-wrapper.opening .envelope-front-text { opacity: 0; }

    .envelope-animal {
      position: absolute;
      z-index: 5;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .envelope-wrapper.opening .envelope-animal { opacity: 0; }

    /* ===== MAIN VALENTINE SCENE ===== */
    #valentine-scene {
      display: none;
      min-height: 100vh;
      position: relative;
    }

    #valentine-scene.active { display: block; }

    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    .animal-illustration {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: animalFadeIn 0.8s ease forwards;
    }

    @keyframes animalFadeIn { to { opacity: 1; } }

    .main-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    #question-screen { text-align: center; }

    .card {
      background: white;
      border-radius: 20px;
      padding: 50px 60px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.06);
      border: 1px solid rgba(180,140,120,0.15);
      max-width: 550px;
      animation: cardIn 0.8s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .dear-elliot {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      color: #b8a898;
      margin-bottom: 12px;
    }

    .question {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: #8b4a4a;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .card-divider {
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, #c9a87c, transparent);
      margin: 20px auto;
    }

    .card-animals {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .card-animals svg { opacity: 0.4; }

    .buttons-area {
      position: relative;
      width: 400px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 30px;
      animation: cardIn 0.8s ease 0.3s both;
    }

    .btn-yes {
      padding: 16px 48px;
      font-size: 1.2rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #8b4a4a;
      color: #faf6f0;
      box-shadow: 0 4px 20px rgba(139, 74, 74, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      z-index: 20;
      position: relative;
      letter-spacing: 1px;
    }

    .btn-yes:hover {
      transform: scale(1.05);
      background: #a05555;
      box-shadow: 0 6px 25px rgba(139, 74, 74, 0.4);
    }

    .btn-no {
      padding: 12px 32px;
      font-size: 1rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: 1.5px solid #d4c8b8;
      border-radius: 50px;
      cursor: pointer;
      background: white;
      color: #b8a898;
      transition: all 0.3s;
      position: absolute;
      z-index: 15;
      user-select: none;
    }

    /* Angry cat overlay */
    #angry-cat-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 200;
      background: rgba(250, 246, 240, 0.92);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }

    #angry-cat-overlay.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .angry-cat-text {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.4rem;
      color: #8b4a4a;
      margin-top: 20px;
      text-align: center;
    }

    .angry-cat-dismiss {
      margin-top: 20px;
      padding: 10px 28px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      border: 1.5px solid #c9a87c;
      border-radius: 50px;
      cursor: pointer;
      background: transparent;
      color: #c9a87c;
      transition: all 0.3s;
    }

    .angry-cat-dismiss:hover {
      background: #c9a87c;
      color: white;
    }

    /* Celebration */
    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: zoomIn 0.6s ease;
    }

    .celebration.active { display: flex; }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .celebration-text {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      color: #8b4a4a;
      margin-bottom: 8px;
    }

    .celebration-subtext {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      color: #b8a898;
      margin-bottom: 35px;
    }

    .photo-container {
      position: relative;
      display: inline-block;
      margin: 20px;
    }

    .photo-container img {
      width: 340px; height: 420px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.1);
      position: relative;
      z-index: 2;
    }

    .photo-frame {
      position: absolute;
      top: -8px; left: -8px; right: -8px; bottom: -8px;
      border: 2px solid rgba(201, 168, 124, 0.4);
      border-radius: 20px;
      z-index: 1;
    }

    .orbiting-hearts {
      position: absolute;
      top: 50%; left: 50%;
      width: 0; height: 0;
      z-index: 3;
    }

    .orbit-heart {
      position: absolute;
      animation: orbit 5s linear infinite;
    }

    .orbit-heart:nth-child(1) { animation-delay: 0s; }
    .orbit-heart:nth-child(2) { animation-delay: 0.83s; }
    .orbit-heart:nth-child(3) { animation-delay: 1.66s; }
    .orbit-heart:nth-child(4) { animation-delay: 2.5s; }
    .orbit-heart:nth-child(5) { animation-delay: 3.33s; }
    .orbit-heart:nth-child(6) { animation-delay: 4.16s; }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(210px) rotate(0deg); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: rotate(360deg) translateX(210px) rotate(-360deg); opacity: 0.6; }
    }

    .photo-glow {
      position: absolute;
      top: -15px; left: -15px; right: -15px; bottom: -15px;
      background: radial-gradient(ellipse, rgba(201, 168, 124, 0.15), transparent 70%);
      border-radius: 25px;
      animation: pulse 3s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.03); opacity: 1; }
    }

    .btn-back {
      margin-top: 35px;
      padding: 12px 30px;
      font-size: 0.95rem;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      border: 1.5px solid #c9a87c;
      border-radius: 50px;
      cursor: pointer;
      background: transparent;
      color: #c9a87c;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-back:hover {
      background: #c9a87c;
      color: white;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .envelope-wrapper { width: 320px; height: 230px; }
      .envelope-body { height: 170px; }
      .envelope-inner { height: 170px; }
      .envelope-flap-shape {
        border-left: 160px solid transparent;
        border-right: 160px solid transparent;
        border-top: 120px solid #d4c8b8;
      }
      .envelope-flap { height: 120px; }
      .letter { width: 270px; height: 140px; }
      .letter-text { font-size: 1.2rem; }
      .envelope-front-text { font-size: 1.1rem; bottom: 50px; }
      .card { padding: 35px 30px; }
      .question { font-size: 2rem; }
      .dear-elliot { font-size: 1.3rem; }
      .buttons-area { width: 100%; height: auto; min-height: 100px; }
      .photo-container img { width: 280px; height: 350px; }
      .celebration-text { font-size: 2rem; }
      .animal-illustration { transform: scale(0.6); transform-origin: top left; }
      .btn-no { display: none !important; }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(170px) rotate(0deg); opacity: 0.6; }
        50% { opacity: 1; }
        100% { transform: rotate(360deg) translateX(170px) rotate(-360deg); opacity: 0.6; }
      }
    }

    /* Mobile tap hint */
    .mobile-tap-hint {
      display: none;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.85rem;
      color: #b8a898;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .mobile-tap-hint { display: block; }
    }
  </style>
</head>
<body>

  <!-- ===== ENVELOPE SCENE ===== -->
  <div id="envelope-scene" onclick="openEnvelope()">
    <div class="envelope-wrapper" id="envelope">
      <div class="envelope-flap">
        <div class="envelope-flap-shape"></div>
      </div>
      <div class="envelope-inner">
        <div class="envelope-inner-pattern"></div>
      </div>
      <div class="letter">
        <div class="letter-text">Will you be<br>my Valentine?</div>
      </div>
      <div class="envelope-body"></div>
      <div class="wax-seal">
        <svg viewBox="0 0 50 50" fill="none">
          <circle cx="25" cy="25" r="22" fill="#8b4a4a"/>
          <circle cx="25" cy="25" r="19" fill="#a05555"/>
          <path d="M25 36C25 36 14 28 14 21.5C14 18 17 15.5 20 15.5C22.5 15.5 24 17 25 18.5C26 17 27.5 15.5 30 15.5C33 15.5 36 18 36 21.5C36 28 25 36 25 36Z" fill="#faf6f0" opacity="0.9"/>
          <circle cx="25" cy="3" r="4" fill="#a05555"/><circle cx="25" cy="47" r="4" fill="#a05555"/>
          <circle cx="3" cy="25" r="4" fill="#a05555"/><circle cx="47" cy="25" r="4" fill="#a05555"/>
          <circle cx="9" cy="9" r="3.5" fill="#a05555"/><circle cx="41" cy="9" r="3.5" fill="#a05555"/>
          <circle cx="9" cy="41" r="3.5" fill="#a05555"/><circle cx="41" cy="41" r="3.5" fill="#a05555"/>
        </svg>
      </div>
      <div class="envelope-front-text">Dear Elliot...</div>
      <div class="envelope-animal" style="top: 68px; right: 18px;">
        <svg width="36" height="28" viewBox="0 0 36 28"><g opacity="0.6">
          <rect x="0" y="0" width="36" height="28" rx="2" fill="#f5ece0" stroke="#c9a87c" stroke-width="1"/>
          <ellipse cx="18" cy="16" rx="12" ry="5" fill="#c9a87c"/>
          <circle cx="27" cy="12" r="4" fill="#c9a87c"/>
          <circle cx="29" cy="11" r="1" fill="#8b6f5e"/>
          <rect x="10" y="19" width="2" height="5" rx="1" fill="#c9a87c"/>
          <rect x="14" y="19" width="2" height="5" rx="1" fill="#c9a87c"/>
          <rect x="22" y="19" width="2" height="5" rx="1" fill="#c9a87c"/>
          <rect x="25" y="19" width="2" height="5" rx="1" fill="#c9a87c"/>
        </g></svg>
      </div>
    </div>
    <div class="envelope-hint">click to open</div>
  </div>

  <!-- ===== VALENTINE SCENE ===== -->
  <div id="valentine-scene">
    <div class="floating-hearts" id="floating-hearts"></div>
    <div id="animal-illustrations"></div>

    <div class="main-content">
      <!-- Question screen -->
      <div id="question-screen">
        <div class="card">
          <div class="dear-elliot">Dear Elliot,</div>
          <div class="question">Will you be<br>my Valentine?</div>
          <div class="card-divider"></div>
          <div class="card-animals">
            <svg width="32" height="28" viewBox="0 0 32 28" fill="none"><ellipse cx="16" cy="18" rx="12" ry="9" fill="#c9a87c" opacity="0.4"/><circle cx="16" cy="10" r="7" fill="#c9a87c" opacity="0.4"/><circle cx="13.5" cy="8.5" r="1" fill="#8b6f5e" opacity="0.5"/><circle cx="18.5" cy="8.5" r="1" fill="#8b6f5e" opacity="0.5"/><ellipse cx="16" cy="11" rx="2" ry="1" fill="#8b6f5e" opacity="0.3"/></svg>
            <svg width="20" height="18" viewBox="0 0 20 18" fill="none"><path d="M10 17C10 17 1 11 1 5.5C1 2.5 3.5.5 6 .5 8 .5 9.5 1.5 10 3 10.5 1.5 12 .5 14 .5 16.5.5 19 2.5 19 5.5 19 11 10 17 10 17Z" fill="#c9a87c" opacity="0.3"/></svg>
            <svg width="40" height="24" viewBox="0 0 40 24" fill="none"><ellipse cx="20" cy="13" rx="14" ry="5" fill="#c9a87c" opacity="0.4"/><circle cx="32" cy="9" r="5" fill="#c9a87c" opacity="0.4"/><circle cx="34" cy="8" r="1" fill="#8b6f5e" opacity="0.5"/><rect x="9" y="17" width="2" height="5" rx="1" fill="#c9a87c" opacity="0.4"/><rect x="14" y="17" width="2" height="5" rx="1" fill="#c9a87c" opacity="0.4"/><rect x="26" y="17" width="2" height="5" rx="1" fill="#c9a87c" opacity="0.4"/><rect x="30" y="17" width="2" height="5" rx="1" fill="#c9a87c" opacity="0.4"/></svg>
            <svg width="20" height="18" viewBox="0 0 20 18" fill="none"><path d="M10 17C10 17 1 11 1 5.5C1 2.5 3.5.5 6 .5 8 .5 9.5 1.5 10 3 10.5 1.5 12 .5 14 .5 16.5.5 19 2.5 19 5.5 19 11 10 17 10 17Z" fill="#c9a87c" opacity="0.3"/></svg>
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><ellipse cx="14" cy="19" rx="8" ry="7" fill="#c9a87c" opacity="0.4"/><circle cx="14" cy="11" r="7" fill="#c9a87c" opacity="0.4"/><polygon points="8,6 7,0 12,4" fill="#c9a87c" opacity="0.4"/><polygon points="20,6 21,0 16,4" fill="#c9a87c" opacity="0.4"/><circle cx="11.5" cy="10" r="1" fill="#8b6f5e" opacity="0.5"/><circle cx="16.5" cy="10" r="1" fill="#8b6f5e" opacity="0.5"/></svg>
          </div>
        </div>

        <div class="buttons-area" id="buttons-area">
          <button class="btn-yes" id="btn-yes" onclick="sayYes()">Yes, always</button>
          <button class="btn-no" id="btn-no">No</button>
        </div>
        <div class="mobile-tap-hint">tap anywhere to say yes</div>
      </div>

      <!-- Celebration screen -->
      <div class="celebration" id="celebration-screen">
        <div class="celebration-text">I knew you would!</div>
        <div class="celebration-subtext">Happy Valentine's Day, my love</div>
        <div class="photo-container" id="photo-container">
          <div class="photo-glow"></div>
          <div class="photo-frame"></div>
          <img id="valentine-photo" src="" alt="Us together">
          <div class="orbiting-hearts">
            <div class="orbit-heart"><svg width="22" height="20" viewBox="0 0 20 18"><path d="M10 17C10 17 1 11 1 5.5C1 2.5 3.5.5 6 .5 8 .5 9.5 1.5 10 3 10.5 1.5 12 .5 14 .5 16.5.5 19 2.5 19 5.5 19 11 10 17 10 17Z" fill="#c9a87c"/></svg></div>

        <line x1="28" y1="48" x2="38" y2="48" stroke="#b8986c" stroke-width="0.7" opacity="0.4"/>
        <!-- Heart -->
        <path d="M20 30C20 30 16 27 16 24.5C16 23 17 22 18.5 22C19.5 22 20 23 20 23C20 23 20.5 22 21.5 22C23 22 24 23 24 24.5C24 27 20 30 20 30Z" fill="#8b4a4a" opacity="0.7"/>
      </svg>`
    };

    // Angry cat SVG
    const angryCatSVG = `<svg width="180" height="190" viewBox="0 0 100 105" fill="none">
      <ellipse cx="50" cy="72" rx="25" ry="28" fill="#d4a060"/>
      <ellipse cx="50" cy="68" rx="23" ry="24" fill="#ddb070" opacity="0.4"/>
      <!-- Puffed up tail -->
      <path d="M74 75Q100 60 95 40Q92 30 88 28" stroke="#d4a060" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M92 35Q95 30 90 26" stroke="#c48a50" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
      <path d="M88 38Q92 34 87 30" stroke="#c48a50" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
      <circle cx="50" cy="35" r="22" fill="#d4a060"/>
      <!-- Angry ears (flattened) -->
      <polygon points="30,24 22,8 42,20" fill="#d4a060"/>
      <polygon points="32,22 26,12 40,20" fill="#c48a50" opacity="0.5"/>
      <polygon points="70,24 78,8 58,20" fill="#d4a060"/>
      <polygon points="68,22 74,12 60,20" fill="#c48a50" opacity="0.5"/>
      <!-- Angry eyebrows -->
      <path d="M34 26L44 30" stroke="#8b5a1a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M66 26L56 30" stroke="#8b5a1a" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Angry eyes (narrow) -->
      <ellipse cx="42" cy="34" rx="4" ry="2.5" fill="#5a8a3a"/>
      <ellipse cx="58" cy="34" rx="4" ry="2.5" fill="#5a8a3a"/>
      <ellipse cx="42" cy="34" rx="2" ry="2" fill="#2a3a1a"/>
      <ellipse cx="58" cy="34" rx="2" ry="2" fill="#2a3a1a"/>
      <circle cx="41" cy="33.5" r="0.7" fill="white" opacity="0.7"/>
      <circle cx="57" cy="33.5" r="0.7" fill="white" opacity="0.7"/>
      <!-- Nose -->
      <path d="M48 39L50 41L52 39Z" fill="#d48a7a"/>
      <!-- Angry mouth (hissing) -->
      <path d="M44 44Q50 48 56 44" stroke="#b0806a" stroke-width="1.2" fill="none"/>
      <path d="M46 44L47 46" stroke="#f0f0e0" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M54 44L53 46" stroke="#f0f0e0" stroke-width="0.8" stroke-linecap="round"/>
      <!-- Bristled whiskers -->
      <line x1="26" y1="35" x2="38" y2="39" stroke="#b8986c" stroke-width="0.8" opacity="0.6"/>
      <line x1="28" y1="42" x2="38" y2="42" stroke="#b8986c" stroke-width="0.8" opacity="0.6"/>
      <line x1="62" y1="39" x2="74" y2="35" stroke="#b8986c" stroke-width="0.8" opacity="0.6"/>
      <line x1="62" y1="42" x2="72" y2="42" stroke="#b8986c" stroke-width="0.8" opacity="0.6"/>
      <ellipse cx="38" cy="95" rx="7" ry="5" fill="#d4a060"/>
      <ellipse cx="62" cy="95" rx="7" ry="5" fill="#d4a060"/>
    </svg>`;

    const angryCatMessages = [
      "Wrong answer! Try again...",
      "The cat is NOT impressed.",
      "Seriously? The cat says no.",
      "That's not the right answer and you know it.",
      "The cat has spoken. Reconsider.",
      "Hiss! That option doesn't exist.",
      "Are you sure about that? The cat isn't.",
      "The cat demands a recount.",
    ];

    // =====================
    // Animal placements (many more!)
    // =====================
    const animalPlacements = [
      { type: 'seal', x: '1%', y: '8%', size: 80, delay: 0.2 },
      { type: 'tiger', x: '80%', y: '4%', size: 75, delay: 0.4 },
      { type: 'dachshund', x: '0%', y: '40%', size: 100, delay: 0.6 },
      { type: 'cat', x: '84%', y: '35%', size: 65, delay: 0.8 },
      { type: 'camel', x: '78%', y: '65%', size: 85, delay: 1.0 },
      { type: 'turtle', x: '2%', y: '70%', size: 75, delay: 1.2 },
      { type: 'saluki', x: '82%', y: '88%', size: 90, delay: 1.4 },
      { type: 'binturong', x: '1%', y: '88%', size: 70, delay: 1.6 },
      { type: 'seal', x: '85%', y: '50%', size: 60, delay: 1.0 },
      { type: 'tiger', x: '3%', y: '55%', size: 55, delay: 1.3 },
      { type: 'cat', x: '40%', y: '92%', size: 55, delay: 1.8 },
      { type: 'dachshund', x: '55%', y: '2%', size: 70, delay: 0.9 },
    ];

    function placeAnimals() {
      const container = document.getElementById('animal-illustrations');
      animalPlacements.forEach(a => {
        const div = document.createElement('div');
        div.className = 'animal-illustration';
        div.style.left = a.x;
        div.style.top = a.y;
        div.style.animationDelay = a.delay + 's';
        div.innerHTML = animalSVGs[a.type](a.size);
        container.appendChild(div);
      });
    }

    // =====================
    // Envelope Animation
    // =====================
    let envelopeOpened = false;

    function openEnvelope() {
      if (envelopeOpened) return;
      envelopeOpened = true;
      document.getElementById('envelope').classList.add('opening');
      setTimeout(() => {
        document.getElementById('envelope-scene').classList.add('hidden');
      }, 1400);
      setTimeout(() => {
        document.getElementById('envelope-scene').style.display = 'none';
        document.getElementById('valentine-scene').classList.add('active');
        placeAnimals();
        createFloatingHearts();
      }, 2000);
    }

    // =====================
    // Photo Management
    // =====================
    let photos = [];
    let photosReady = false;

    function discoverPhotos() {
      return fetch('photos/photos.json')
        .then(r => r.json())
        .then(filenames => filenames.map(f => 'photos/' + f))
        .catch(() => []);
    }

    function getRandomPhoto() {
      if (photos.length === 0) return '';
      const lastShown = localStorage.getItem('valentineLastPhoto') || '';
      let available = photos.filter(p => p !== lastShown);
      if (available.length === 0) available = photos;
      const pick = available[Math.floor(Math.random() * available.length)];
      localStorage.setItem('valentineLastPhoto', pick);
      return pick;
    }

    // =====================
    // Floating Hearts
    // =====================
    function createFloatingHearts() {
      const container = document.getElementById('floating-hearts');
      const colors = ['#c9a87c', '#8b4a4a', '#b8a898', '#d4b88c'];
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-heart';
        const size = 14 + Math.random() * 18;
        const color = colors[Math.floor(Math.random() * colors.length)];
        heart.innerHTML = `<svg width="${size}" height="${size * 0.9}" viewBox="0 0 20 18"><path d="M10 17C10 17 1 11 1 5.5C1 2.5 3.5.5 6 .5 8 .5 9.5 1.5 10 3 10.5 1.5 12 .5 14 .5 16.5.5 19 2.5 19 5.5 19 11 10 17 10 17Z" fill="${color}" opacity="0.5"/></svg>`;
        heart.style.left = Math.random() * 100 + '%';
        heart.style.animationDuration = (12 + Math.random() * 16) + 's';
        heart.style.animationDelay = (Math.random() * 12) + 's';
        container.appendChild(heart);
      }
    }

    // =====================
    // No Button — Angry Cat + Avoidance
    // =====================
    const btnNo = document.getElementById('btn-no');
    const buttonsArea = document.getElementById('buttons-area');
    let noHoverCount = 0;

    function showAngryCat() {
      const overlay = document.getElementById('angry-cat-overlay');
      document.getElementById('angry-cat-svg').innerHTML = angryCatSVG;
      document.getElementById('angry-cat-text').textContent =
        angryCatMessages[Math.floor(Math.random() * angryCatMessages.length)];
      overlay.classList.add('active');
    }

    function dismissAngryCat() {
      document.getElementById('angry-cat-overlay').classList.remove('active');
    }

    btnNo.addEventListener('mouseenter', function () {
      noHoverCount++;
      // Show angry cat every time
      showAngryCat();
      // Also move the button
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight - 50;
      btnNo.style.position = 'fixed';
      btnNo.style.left = Math.random() * maxX + 'px';
      btnNo.style.top = Math.random() * maxY + 'px';
      btnNo.style.transition = 'none';
      const currentSize = parseFloat(btnNo.style.fontSize) || 1;
      btnNo.style.fontSize = Math.max(0.55, currentSize - 0.08) + 'rem';
      btnNo.style.padding = '8px 20px';
    });

    btnNo.addEventListener('click', function (e) {
      e.stopPropagation();
      showAngryCat();
    });

    // =====================
    // Yes Button — Desktop: follows mouse, Mobile: appears at tap
    // =====================
    const btnYes = document.getElementById('btn-yes');
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let yesFollowing = true;

    document.addEventListener('mousemove', function(e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    function animateYesButton() {
      if (!yesFollowing || isMobile) return;
      const rect = btnYes.getBoundingClientRect();
      const dx = mouseX - (rect.left + rect.width / 2);
      const dy = mouseY - (rect.top + rect.height / 2);
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 300 && dist > 5) {
        const currentLeft = parseFloat(btnYes.style.left) || 0;
        const currentTop = parseFloat(btnYes.style.top) || 0;
        btnYes.style.position = 'relative';
        btnYes.style.left = (currentLeft + dx * 0.07) + 'px';
        btnYes.style.top = (currentTop + dy * 0.07) + 'px';
      }
      requestAnimationFrame(animateYesButton);
    }

    if (!isMobile) {
      animateYesButton();
    }

    // Mobile: tap anywhere on question screen to move button there and trigger yes
    if (isMobile) {
      document.addEventListener('touchstart', function(e) {
        // Only on question screen
        const qScreen = document.getElementById('question-screen');
        if (qScreen.style.display === 'none') return;
        if (!document.getElementById('valentine-scene').classList.contains('active')) return;
        if (document.getElementById('angry-cat-overlay').classList.contains('active')) return;

        const touch = e.touches[0];
        const tx = touch.clientX;
        const ty = touch.clientY;

        // Move button to tap position
        const btnRect = btnYes.getBoundingClientRect();
        btnYes.style.position = 'fixed';
        btnYes.style.left = (tx - btnRect.width / 2) + 'px';
        btnYes.style.top = (ty - btnRect.height / 2) + 'px';
        btnYes.style.zIndex = '9999';

        // Brief delay then trigger yes
        setTimeout(() => sayYes(), 200);
      });
    }

    // =====================
    // Confetti
    // =====================
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let confettiPieces = [];
    let confettiRunning = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createConfetti() {
      const colors = ['#c9a87c', '#8b4a4a', '#d4b88c', '#b8a898', '#a05555',
                      '#ddc49c', '#c4b5a5', '#e8ddd0', '#faf6f0', '#6b5545'];
      confettiPieces = [];
      for (let i = 0; i < 250; i++) {
        confettiPieces.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 8 + 4,
          h: Math.random() * 5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          speed: Math.random() * 3 + 1.5,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.15,
          drift: (Math.random() - 0.5) * 1.5,
          opacity: 1
        });
      }
      confettiRunning = true;
      animateConfetti();
    }

    function animateConfetti() {
      if (!confettiRunning) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      let active = 0;
      confettiPieces.forEach(p => {
        if (p.opacity <= 0) return;
        active++;
        p.y += p.speed; p.x += p.drift; p.angle += p.spin;
        if (p.y > canvas.height + 20) p.opacity -= 0.02;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      });
      if (active > 0) requestAnimationFrame(animateConfetti);
      else { confettiRunning = false; ctx.clearRect(0, 0, canvas.width, canvas.height); }
    }

    // =====================
    // Say Yes!
    // =====================
    function sayYes() {
      yesFollowing = false;
      document.getElementById('question-screen').style.display = 'none';
      document.getElementById('celebration-screen').classList.add('active');
      const photo = getRandomPhoto();
      if (photo) {
        document.getElementById('valentine-photo').src = photo;
        document.getElementById('photo-container').style.display = '';
      } else {
        document.getElementById('photo-container').style.display = 'none';
      }
      createConfetti();
      setTimeout(createConfetti, 1200);
      setTimeout(createConfetti, 2800);
    }

    // =====================
    // Go Back
    // =====================
    function goBack() {
      document.getElementById('celebration-screen').classList.remove('active');
      document.getElementById('question-screen').style.display = '';
      btnYes.style.position = 'relative';
      btnYes.style.left = '0px';
      btnYes.style.top = '0px';
      btnYes.style.zIndex = '20';
      yesFollowing = true;
      if (!isMobile) animateYesButton();
      btnNo.style.position = 'absolute';
      btnNo.style.left = '';
      btnNo.style.top = '';
      btnNo.style.fontSize = '';
      btnNo.style.padding = '';
      noHoverCount = 0;
      confettiRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // =====================
    // Initialize
    // =====================
    discoverPhotos().then(found => {
      photos = found;
      photosReady = true;
    });
  </script>
</body>
</html>
